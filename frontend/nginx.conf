server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
 location /api/ { proxy_pass http://backend:8080; proxy_http_version 1.1; proxy_set_header Host $host; proxy_buffering off; proxy_cache off; proxy_read_timeout 660s; }
 location /actuator/ { return 404; }
 location / { try_files $uri $uri/ /index.html; }
 location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
}
