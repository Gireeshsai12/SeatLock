name: seatlock-tests
services:
  db:
    image: postgres:16.9-alpine3.21
    environment: {POSTGRES_DB: seatlock_test, POSTGRES_USER: seatlock, POSTGRES_PASSWORD: test-only}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U seatlock -d seatlock_test']
      interval: 3s
      retries: 20
  redis:
    image: redis:7.4.4-alpine3.21
  tests:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /code
    volumes: ['./backend:/code']
    environment: {DB_URL: 'jdbc:postgresql://db:5432/seatlock_test', DB_PASSWORD: test-only, REDIS_HOST: redis}
    depends_on:
      db: {condition: service_healthy}
    command: [mvn, -B, test]
